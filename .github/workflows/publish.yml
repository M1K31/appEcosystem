name: Publish

# Tag-driven. PyPI versions are immutable — a bad upload can only be yanked,
# never replaced — so this must never fire on an ordinary push to main.
# Use the manual dispatch against TestPyPI to rehearse.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to upload"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify packaging metadata
        # Fails the release before anything is uploaded if a required field was
        # dropped or a distribution name drifted from its PyPI project.
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest tests/test_packaging.py -v

      - name: Build each distribution into its own directory
        # Kept separate because each package uploads under its own trusted
        # publisher: pypa/gh-action-pypi-publish publishes everything in the
        # directory it is given, so one shared dist/ would make every job try to
        # upload all four and fail on the three it is not authorized for.
        run: |
          python -m pip install --upgrade build twine
          rm -rf dist && mkdir -p dist
          build_one() {
            echo "::group::build $2 ($1)"
            python -m build --outdir "dist/$2" "$1"
            echo "::endgroup::"
          }
          build_one auth/python               auth
          build_one packages/ecosystem-client client
          build_one packages/ecosystem-ai     ai
          build_one .                         umbrella
          twine check dist/*/*
          ls -laR dist/

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  testpypi:
    name: "TestPyPI: ${{ matrix.package }}"
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    strategy:
      fail-fast: false        # report every package's outcome, not just the first failure
      matrix:
        include:
          - { package: auth,   environment: testpypi-auth }
          - { package: client, environment: testpypi-client }
          - { package: ai,     environment: testpypi-ai }
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write         # REQUIRED: mints the OIDC token PyPI trusts
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/${{ matrix.package }}
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI accumulates rehearsals; don't fail a dry run on a version
          # that was already uploaded there.
          skip-existing: true

  pypi:
    name: "PyPI: ${{ matrix.package }}"
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    strategy:
      fail-fast: false
      matrix:
        # PyPI allows only THREE pending trusted publishers per account at once.
        # The three libraries are what third parties actually import, so they go
        # first. Publishing converts each pending publisher into a regular one
        # and frees its slot — after this succeeds, register a fourth pending
        # publisher for `appecosystem` (environment pypi-umbrella) and add:
        #   - { package: umbrella, environment: pypi-umbrella }
        include:
          - { package: auth,   environment: pypi-auth }
          - { package: client, environment: pypi-client }
          - { package: ai,     environment: pypi-ai }
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/${{ matrix.package }}
