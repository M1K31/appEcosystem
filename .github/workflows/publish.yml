name: Publish

# Tag-driven. PyPI versions are immutable — a bad upload can only be yanked,
# never replaced — so this must never fire on an ordinary push to main.
# Use the manual dispatch against TestPyPI to rehearse.
# There is deliberately no TestPyPI path. It would need a separate account on
# test.pypi.org plus three more pending publishers, and the one risk it uniquely
# covered — that appecosystem-client resolves appecosystem-auth from an index —
# is verified against the built wheels instead (see tests/test_packaging.py for
# the metadata, and the local find-links install documented in the release
# checklist). To add it back: create testpypi-* environments, register the
# publishers there, and add a job passing repository-url plus skip-existing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify packaging metadata
        # Fails the release before anything is uploaded if a required field was
        # dropped or a distribution name drifted from its PyPI project.
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest tests/test_packaging.py -v

      - name: Build each distribution into its own directory
        # Kept separate because each package uploads under its own trusted
        # publisher: pypa/gh-action-pypi-publish publishes everything in the
        # directory it is given, so one shared dist/ would make every job try to
        # upload all four and fail on the three it is not authorized for.
        run: |
          python -m pip install --upgrade build twine
          rm -rf dist && mkdir -p dist
          build_one() {
            echo "::group::build $2 ($1)"
            python -m build --outdir "dist/$2" "$1"
            echo "::endgroup::"
          }
          build_one auth/python               auth
          build_one packages/ecosystem-client client
          build_one packages/ecosystem-ai     ai
          build_one .                         umbrella
          twine check dist/*/*
          ls -laR dist/

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  pypi:
    name: "PyPI: ${{ matrix.package }}"
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The three libraries published first (v0.4.0): PyPI caps pending
        # trusted publishers at three per account, and these are what third
        # parties import. Publishing converted them to regular publishers and
        # freed the slots, so the umbrella could then be registered.
        include:
          - { package: auth,     environment: pypi-auth }
          - { package: client,   environment: pypi-client }
          - { package: ai,       environment: pypi-ai }
          - { package: umbrella, environment: pypi-umbrella }
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/${{ matrix.package }}
          # These four version independently, so most tags bump only some of
          # them. Without this, every release fails on the packages whose
          # version has not changed. Note the trade-off: a package you MEANT to
          # bump but forgot will now skip silently rather than fail loudly, so
          # check the job summaries against what you intended to ship.
          skip-existing: true
