name: Publish

# Tag-driven. PyPI versions are immutable — a bad upload can only be yanked,
# never replaced — so this must never fire on an ordinary push to main.
# Use the manual dispatch against TestPyPI to rehearse.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to upload"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify packaging metadata
        # Fails the release before anything is uploaded if a required field was
        # dropped or a distribution name drifted from its PyPI project.
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest tests/test_packaging.py -v

      - name: Build all four distributions
        run: |
          python -m pip install --upgrade build twine
          rm -rf dist && mkdir -p dist
          for d in auth/python packages/ecosystem-client packages/ecosystem-ai .; do
            echo "::group::build $d"
            python -m build --outdir dist "$d"
            echo "::endgroup::"
          done
          twine check dist/*
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    environment: testpypi
    permissions:
      id-token: write          # REQUIRED: mints the OIDC token PyPI trusts
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI accumulates rehearsals; don't fail a dry run on a version
          # that was already uploaded there.
          skip-existing: true

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    environment: pypi          # add a required reviewer here: the release gate
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
