name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the workspace packages together with the root package, so a
          # dependency floor that is not on PyPI yet (a version bumped for the next
          # release) resolves to the checkout instead of failing.
          pip install -e auth/python -e packages/ecosystem-ai -e packages/ecosystem-client \
            -e packages/ecosystem-policy -e packages/ecosystem-hub -e packages/ecosystem-compute \
            -e packages/ecosystem-voice -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build the UI controls bundle served at /ui
        run: npm --prefix packages/ecosystem-ui-controls run build
      - name: Run tests
        run: pytest -q

  ecosystem-smoke:
    name: Ecosystem acceptance smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the workspace packages together with the root package, so a
          # dependency floor that is not on PyPI yet (a version bumped for the next
          # release) resolves to the checkout instead of failing.
          pip install -e auth/python -e packages/ecosystem-ai -e packages/ecosystem-client \
            -e packages/ecosystem-policy -e packages/ecosystem-hub -e packages/ecosystem-compute \
            -e packages/ecosystem-voice -e ".[dev]"
      - name: Run smoke test (single-host, subset, networked guarantees)
        run: ./scripts/smoke-ecosystem.sh

  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit dependencies
        run: pip-audit --skip-editable --strict || pip-audit

  js:
    name: JS tests and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install workspace deps
        run: npm install --workspaces --if-present
      - name: Build the UI controls bundle (its tests load the built file)
        run: npm --prefix packages/ecosystem-ui-controls run build
      - name: Run JS tests
        run: node --test
      - name: npm audit (non-blocking advisory)
        run: npm audit --omit=dev || true

  shellcheck:
    name: Shell script lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t appecosystem-registry:ci .
