[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "appecosystem-voice"
version = "0.1.0"
description = "Tier-scaled local speech recognition and voice intent parsing for appEcosystem"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Mikel Smart" }]
dependencies = []

[tool.setuptools.packages.find]
include = ["ecosystem_voice*"]

