[build-system]
# >=77 for the PEP 639 `license`/`license-files` fields used below.
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Prefixed to group the family under the reserved `appEcosystem` PyPI name.
# Import name is unchanged: `pip install appecosystem-client` -> `import ecosystem_client`.
name = "appecosystem-client"
version = "0.3.1"
description = "Service registration, peer discovery and event bus client for appEcosystem"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Mikel Smart" }]
keywords = ["service-discovery", "events", "microservices", "mdns", "appecosystem"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]

# ecosystem_auth is imported at runtime for HMAC request signing
# (ecosystem_client/discovery.py::_require_auth). This was carried as a comment
# while both packages were installed from local paths, where a hard dependency
# could not resolve against an index. Publishing is the condition that comment
# named, so it is now a real dependency.
dependencies = [
    "httpx>=0.24.0",
    "appecosystem-auth>=0.4.0",
]

[project.optional-dependencies]
mdns = ["zeroconf>=0.80.0"]
yaml = ["pyyaml>=6.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

# Keep table headers last: any bare key after a [table] belongs to that table,
# so a `dependencies` placed below [project.urls] silently becomes a URL entry
# and the build fails with "project.urls.dependencies must be string".
[project.urls]
Homepage = "https://github.com/M1K31/appEcosystem"
Source = "https://github.com/M1K31/appEcosystem"
Issues = "https://github.com/M1K31/appEcosystem/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ecosystem_client*"]
