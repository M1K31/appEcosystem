[build-system]
# >=77 for the PEP 639 `license`/`license-files` fields used below.
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# The umbrella distribution: the registry service, event bus and `ecosystem` CLI.
# Renamed from `app-ecosystem` to match the reserved PyPI project `appEcosystem`
# — PEP 503 normalizes that to `appecosystem`, which is NOT the same project as
# `app-ecosystem`, so the old name would have published somewhere else entirely.
name = "appecosystem"
version = "0.3.0"
description = "Service registry, event bus and coordination layer for the appEcosystem service mesh"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Mikel Smart" }]
keywords = ["service-registry", "event-bus", "microservices", "home-automation", "appecosystem"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]

dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.24.0",
    "zeroconf>=0.80.0",
    # Depend on the separately published libraries rather than bundling copies.
    # This package used to ship its own ecosystem_client/ (see the exclusion in
    # tool.setuptools.packages.find below): registry/app.py imports it, and
    # ecosystem_auth is imported throughout the registry and CLI.
    "appecosystem-client>=0.3.1",
    "appecosystem-auth>=0.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "httpx>=0.24"]

[project.scripts]
ecosystem = "cli.main:main"

# Keep table headers last: any bare key after a [table] belongs to that table,
# so a `dependencies` placed below [project.urls] silently becomes a URL entry
# and the build fails with "project.urls.dependencies must be string".
[project.urls]
Homepage = "https://github.com/M1K31/appEcosystem"
Source = "https://github.com/M1K31/appEcosystem"
Issues = "https://github.com/M1K31/appEcosystem/issues"

[tool.setuptools.packages.find]
# ecosystem_client is deliberately NOT included: it is published separately as
# appecosystem-client and is a declared dependency above. Shipping it here too
# made both distributions claim ownership of the same 18 files, so installing
# this package could silently overwrite a NEWER appecosystem-client with the
# copy bundled at this package's build time — while pip still reported the newer
# version as installed. An invisible downgrade is worse than a missing module.
include = ["cli*", "events*", "llm*", "registry*"]
